<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/origin-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/origin-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/origin-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Origin Billing</title>
    <meta name="description" content="Origin shop billing: bills, products, stock, customers and monthly GST reports." />
    <!-- The colour theme (black & white or red & white) is set before the
         first paint, so the screen never flashes the other one. -->
    <script>
      (function () {
        var theme = 'mono';
        try {
          var saved = localStorage.getItem('origin-billing-theme');
          if (saved === 'red' || saved === 'mono') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Origin type: Anybody (condensed, heavy titles and big numbers) + Instrument Sans
         (everything else); Noto Sans Telugu for the Telugu screens. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full font-sans text-os-ink bg-os-page selection:bg-os-ink selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
